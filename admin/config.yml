# MITTI CMS — Decap CMS Configuration
# Edit products, blog posts, and site settings from /admin/
# After saving: changes commit to GitHub → Actions auto-rebuilds the site

backend:
  name: github
  repo: pankajjjat/Art
  branch: main
  base_url: https://oauth.decapcms.dev

media_folder: "images/optimized"
public_folder: "images/optimized"

site_url: https://pankajjjat.github.io/Art
display_url: https://pankajjjat.github.io/Art
logo_url: https://pankajjjat.github.io/Art/favicon.svg

collections:
  - label: "Products"
    label_singular: "Product"
    name: "products"
    description: "Manage your product catalog — add new pieces, update prices, toggle stock availability."
    identifier_field: "slug"
    summary: "{{slug}} — ₹{{price}} {% if inStock %}✅{% else %}❌ Out of Stock{% endif %}"
    create: true
    delete: true
    format: "json"
    files:
      - label: "Product Catalog"
        name: "products-json"
        file: "data/products.json"
        summary: "{{slug}}"
        fields:
          - { label: "ID", name: "id", widget: "number", default: 1, hint: "Unique numeric ID" }
          - { label: "Product Name", name: "name", widget: "string" }
          - { label: "Slug", name: "slug", widget: "string", hint: "URL-friendly: mountain-vista" }
          - { label: "Category", name: "category", widget: "select",
              options: ["landscapes", "abstract", "lippan-art", "modern-art", "wall-decor"] }
          - { label: "Category Display", name: "cat_clean", widget: "select",
              options: ["Landscapes", "Abstract", "Lippan Art", "Modern Art", "Wall Decor"] }
          - { label: "Price (₹)", name: "price", widget: "number", value_type: "int", min: 1 }
          - { label: "Description", name: "description", widget: "text" }
          - { label: "Dimensions", name: "dimensions", widget: "string", hint: 'e.g., 30" × 40"' }
          - { label: "Image", name: "image", widget: "string", hint: "landscapes_1.jpg" }
          - { label: "SVG Fallback", name: "svg", widget: "string", hint: "mountain-vista.svg" }
          - { label: "Featured", name: "featured", widget: "boolean", default: false, required: false }
          - { label: "In Stock", name: "inStock", widget: "boolean", default: true, required: false }

  - label: "Blog Posts"
    label_singular: "Post"
    name: "blog"
    identifier_field: "slug"
    summary: "{{slug}} — {{date}}"
    create: true
    delete: true
    format: "json"
    files:
      - label: "Blog Posts"
        name: "blog-json"
        file: "data/blog.json"
        fields:
          - { label: "ID", name: "id", widget: "number", default: 1 }
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Slug", name: "slug", widget: "string", hint: "URL-friendly" }
          - { label: "Category", name: "category", widget: "string" }
          - { label: "Read Time (min)", name: "readTime", widget: "number", value_type: "int", min: 1 }
          - { label: "Date", name: "date", widget: "string", hint: "e.g., Jan 15, 2026" }
          - { label: "Excerpt", name: "excerpt", widget: "text" }
          - { label: "Image", name: "image", widget: "string", hint: "blog-lippan-intro.jpg" }
          - { label: "SVG Fallback", name: "svg", widget: "string", hint: "blog-lippan-intro.svg" }

  - label: "Site Settings"
    name: "settings"
    description: "Global site settings — brand name, tagline, social links, contact info."
    files:
      - label: "Global Settings"
        name: "site-settings"
        file: "data/settings.json"
        format: "json"
        fields:
          - { label: "Site Name", name: "site_name", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string" }
          - { label: "Full Tagline", name: "full_tagline", widget: "string" }
          - { label: "SEO Description", name: "description", widget: "text" }
          - { label: "Website URL", name: "url", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Phone", name: "phone", widget: "string" }
          - { label: "Location", name: "location", widget: "string" }
          - { label: "Currency", name: "currency", widget: "string", default: "INR" }
          - { label: "Founder", name: "founder", widget: "string" }
          - { label: "Founding Year", name: "foundingDate", widget: "string" }
          - label: "Social Links"
            name: "social"
            widget: "object"
            fields:
              - { label: "Instagram", name: "instagram", widget: "string" }
              - { label: "Facebook", name: "facebook", widget: "string" }
              - { label: "Pinterest", name: "pinterest", widget: "string" }
