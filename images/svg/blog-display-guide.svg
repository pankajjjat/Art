<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0a1a10"/><stop offset="100%" stop-color="#2a5a3a"/></linearGradient>
  <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#d4a056" stop-opacity=".4"/><stop offset="100%" stop-color="transparent"/></linearGradient>
</defs>
<rect width="800" height="600" fill="url(#sky)"/>
<polygon points="0,350 120,150 250,350" fill="#4a8a5a" opacity=".5"/>
<polygon points="150,400 350,100 550,400" fill="#2a5a3a" opacity=".6"/>
<polygon points="400,450 600,200 800,450" fill="#4a8a5a" opacity=".4"/>
<circle cx="650" cy="120" r="50" fill="url(#sun)"/>
<ellipse cx="400" cy="480" rx="350" ry="80" fill="#d4a056" opacity=".05"/>
</svg>
